# Standard nginx WebSocket-proxying idiom -- see the identical map in
# observability/nginx/nginx.conf for why (that's the gateway hop; this file
# is the SPA's own nginx, the first hop from the browser -- both need it,
# the chat WebSocket goes browser -> this nginx -> gateway -> app).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chat WebSocket upgrade -- needs Connection: Upgrade, which the plain
    # /api/ proxy below doesn't send (and shouldn't, for ordinary REST
    # calls). Matched before /api/ so this takes priority for the one path
    # that needs it.
    location ~ ^/api/requests/\d+/messages/ws$ {
        proxy_pass http://gateway:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # API requests go through the gateway (rate-limited reverse proxy in
    # front of `app`, see observability/nginx/nginx.conf), not straight to
    # the backend -- the gateway is the single real entry point, this isn't
    # a debug-only bypass path. The SPA's axios client always calls
    # relative /api/... paths, same as the Vite dev proxy.
    location /api/ {
        proxy_pass http://gateway:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
    }

    # Service photos / master avatars, served straight out of MinIO's S3
    # API. Bucket is named "media" to match this prefix exactly, so no path
    # rewrite is needed -- /media/services/x.svg -> minio:9000/media/services/x.svg.
    location /media/ {
        proxy_pass http://minio:9000/media/;
        proxy_set_header Host $host;
    }

    # SPA fallback: any non-file route resolves to index.html so vue-router
    # (history mode) can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
