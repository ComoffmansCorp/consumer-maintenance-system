server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the Go backend container. The SPA's axios client
    # always calls relative /api/... paths, same as the Vite dev proxy.
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
    }

    # SPA fallback: any non-file route resolves to index.html so vue-router
    # (history mode) can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
