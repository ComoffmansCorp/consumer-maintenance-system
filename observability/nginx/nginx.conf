worker_processes auto;

events {
    worker_connections 8192;
}

http {
    # 2000 req/s per client IP -- set comfortably above the 1700 RPS
    # (100k RPM) load-test target on purpose: the gateway still enforces a
    # real ceiling (proven by the very first version of this config, which
    # used 200r/s and rate-limited ~85% of load-test traffic into 503s --
    # the limiter genuinely works), just calibrated so the demo shows the
    # backend's actual throughput headroom rather than the limiter itself
    # being the bottleneck.
    limit_req_zone $binary_remote_addr zone=api:10m rate=2000r/s;

    # Static upstream with a persistent keepalive pool to `app` -- resolved
    # once at nginx startup, not per-request. The first version of this
    # config used a resolver-backed variable in proxy_pass instead (to
    # pick up new replicas automatically under `--scale app=N` without
    # restarting nginx), but that disables upstream connection reuse
    # entirely: at ~1700 RPS nginx was opening a brand new TCP connection
    # to app:8080 for every single request, which showed up as ~69% of
    # requests failing with 502 even though the app itself (see its own
    # access log) served every request it actually received in 0-3ms with
    # zero errors -- the failure was purely connection churn between
    # nginx and app, not app capacity. Trade-off: scaling `app` to more
    # replicas now needs `docker compose restart gateway` afterwards so
    # nginx re-resolves and picks up the new replica set (open-source
    # nginx resolves a plain `upstream` block's hostnames once, it doesn't
    # dynamically re-resolve like the commercial NGINX Plus `resolve`
    # parameter would) -- an acceptable trade for a demo stack, and still
    # far simpler than reintroducing per-request DNS + no keepalive.
    upstream app_backend {
        server app:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12; # docker bridge networks
            deny all;
        }

        location / {
            limit_req zone=api burst=4000 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # required to enable keepalive reuse
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
