worker_processes auto;

events {
    worker_connections 8192;
}

http {
    # Standard nginx WebSocket-proxying idiom (nginx.org's own docs use
    # this exact map): $http_upgrade is only ever "websocket" or empty, so
    # this turns that into the right Connection header value for either
    # case -- passing the client's raw Connection header through instead
    # can carry extra directives (e.g. "keep-alive, Upgrade") that aren't
    # guaranteed to mean the same thing to the upstream.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Raised again, 5000r/s -> 10000r/s, for the staircase test up to 400k
    # RPM (6667 RPS peak) -- same reasoning each time this number moves:
    # the limiter should stay a real, proven ceiling (the very first
    # version at 200r/s rate-limited ~85% of traffic into 503s), not the
    # thing that caps this specific run below what the backend can do.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10000r/s;

    # Static upstream with a persistent keepalive pool to `app` -- resolved
    # once at nginx startup, not per-request. The first version of this
    # config used a resolver-backed variable in proxy_pass instead (to
    # pick up new replicas automatically under `--scale app=N` without
    # restarting nginx), but that disables upstream connection reuse
    # entirely: at ~1700 RPS nginx was opening a brand new TCP connection
    # to app:8080 for every single request, which showed up as ~69% of
    # requests failing with 502 even though the app itself (see its own
    # access log) served every request it actually received in 0-3ms with
    # zero errors -- the failure was purely connection churn between
    # nginx and app, not app capacity. Trade-off: scaling `app` to more
    # replicas now needs `docker compose restart gateway` afterwards so
    # nginx re-resolves and picks up the new replica set (open-source
    # nginx resolves a plain `upstream` block's hostnames once, it doesn't
    # dynamically re-resolve like the commercial NGINX Plus `resolve`
    # parameter would) -- an acceptable trade for a demo stack, and still
    # far simpler than reintroducing per-request DNS + no keepalive.
    upstream app_backend {
        server app:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12; # docker bridge networks
            deny all;
        }

        # Service photos / master avatars, straight out of MinIO -- same
        # location as frontend/nginx.conf's, needed here too because the
        # Android app talks to this gateway directly (not through the SPA's
        # own nginx), and every image URL the backend returns (e.g.
        # "/media/masters/master1.jpg") is relative to whichever host
        # served the API response.
        location /media/ {
            proxy_pass http://minio:9000/media/;
            proxy_set_header Host $host;
        }

        # Chat WebSocket upgrade -- needs Connection: Upgrade, which the
        # generic `location /` below deliberately clears
        # (`proxy_set_header Connection "";`) to keep the keepalive pool to
        # `app` alive under load (see that block's own comment). A
        # WebSocket handshake needs the opposite header, so it gets its own
        # location rather than fighting that setting. $http_connection
        # instead of a literal "upgrade" so a plain (non-upgrade) request to
        # this same path still proxies as ordinary HTTP.
        location ~ ^/api/requests/\d+/messages/ws$ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s; # long-lived connection, not a request/response round trip
        }

        location / {
            limit_req zone=api burst=15000 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # required to enable keepalive reuse
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
