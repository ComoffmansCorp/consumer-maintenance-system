version: "2"
sql:
  - engine: postgresql
    queries: sql/auth
    schema: migrations
    gen:
      go:
        package: authdb
        out: internal/auth/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
  - engine: postgresql
    queries: sql/catalog
    schema: migrations
    gen:
      go:
        package: catalogdb
        out: internal/catalog/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            go_type:
              type: "float64"
              pointer: true
            nullable: true
