services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: curs3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No password, same as db above -- this is a local demo stack, not a
  # security-hardened deployment. Backs session revocation (internal/auth)
  # and the catalog read-through cache (internal/catalog).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@db:5432/curs3?sslmode=disable",
        "up",
      ]
    restart: "no"

  # One-shot: fills a fresh database with a demo tenant, staff, consumers,
  # addresses and tasks in every status (via the real domain services, so
  # passwords are hashed correctly). Safe to re-run — skips if already seeded.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/curs3?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or .env file}
      FILE_UPLOAD_DIR: /app/uploads
    # The image's ENTRYPOINT is ["./api"]; compose's `command` is appended
    # to it as arguments rather than replacing it, so this must override
    # `entrypoint` instead to actually run the seeder.
    entrypoint: ["./seed"]
    volumes:
      - uploads:/app/uploads
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/curs3?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # JWT_SECRET has no default on purpose — never commit a real secret.
      # Set it in a local .env file (see .env.example) before running.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or .env file}
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "7"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost"
      FILE_UPLOAD_DIR: /app/uploads
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    # No fixed host port: nginx (below) is the single entry point. A fixed
    # "8080:8080" here would also make `docker compose up --scale app=N`
    # (N>1) fail outright -- two containers can't both bind the same host
    # port. Reach a specific replica directly for debugging via
    # `docker compose exec app-1 ...` or `docker network inspect` instead.
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
      - minio
    ports:
      - "5173:80"

  # Reverse proxy / gateway in front of `app`: rate-limiting (nginx
  # `limit_req`) and a persistent keepalive connection pool to the backend
  # -- see observability/nginx/nginx.conf, including why it's a static
  # `upstream` block (resolved once at startup) rather than a dynamic
  # resolver-backed one: the dynamic version disabled keepalive reuse and
  # caused ~69% of requests to fail with 502 at load-test throughput.
  # Scaling `app` to more replicas needs `docker compose restart gateway`
  # afterwards for the same reason.
  #
  # Originally built on Traefik with Docker-based service discovery, but
  # every Traefik 3.x release tested here (v3.1, v3.3) bundles a Docker
  # client this host's daemon (a shared Avito devenv Lima VM, not a
  # standard local Docker Desktop) rejects outright ("client version 1.24
  # is too old, minimum supported API version is 1.40") -- the daemon is
  # the constraint, not Traefik's version. Switching Traefik to its static
  # file provider (no Docker socket at all) then hit a second, unexplained
  # routing failure (every request, including `/`, came back as Traefik's
  # own internal 404 rather than reaching `app`) that wasn't worth
  # debugging further given nginx does the same job with a much smaller
  # surface area and no Docker API dependency whatsoever.
  gateway:
    image: nginx:alpine
    volumes:
      - ./observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Host port 80 is already claimed by this machine's own Lima VM port
    # forwarder (unrelated to Docker, unrelated to this project) --
    # confirmed nginx itself works correctly inside the container/Docker
    # network regardless (frontend -> gateway -> app already proven live),
    # this is purely about which host port reaches it from outside Docker.
    ports:
      - "8000:80"
    depends_on:
      - app

  # Sidecar exposing gateway.nginx_http_requests_total etc. in Prometheus
  # format, scraped from nginx's built-in stub_status (see nginx.conf) --
  # nginx itself doesn't speak Prometheus natively.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command:
      - "--nginx.scrape-uri=http://gateway:80/stub_status"
    depends_on:
      - gateway

  # Scrapes app:8080/metrics (internal/platform/observability) and
  # nginx-exporter:9113/metrics (gateway-level request counts).
  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
      - nginx-exporter

  # Default admin/admin credentials -- fine for a local demo stack, change
  # before exposing this anywhere real. Datasource + dashboard are
  # provisioned automatically from ./observability/grafana on first boot,
  # no manual UI setup needed. GF_INSTALL_PLUGINS pulls the official
  # ClickHouse datasource plugin so app_logs (below) is queryable from
  # Grafana too, not just Prometheus metrics.
  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - clickhouse

  # Log storage. Structured JSON logs (internal/platform/middleware/logging.go)
  # land here via the `vector` shipper below -- app code itself never talks
  # to ClickHouse directly, it just logs to stdout like always.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Without these, the entrypoint disables network access entirely for
      # the `default` user (security default on recent images) -- every
      # HTTP request, including from Vector/Grafana on the same Docker
      # network, comes back 403 rather than actually connecting.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./observability/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123" # HTTP interface, used by both Vector and Grafana's plugin
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Tails `app`'s Docker logs (see observability/vector/vector.yaml for why
  # it's scoped by compose-project + service label rather than an
  # unfiltered docker_logs source -- this daemon is a shared Avito devenv
  # host running many unrelated containers) and ships parsed JSON log
  # lines into ClickHouse.
  vector:
    image: timberio/vector:0.41.1-alpine
    volumes:
      - ./observability/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - clickhouse
      - app

  # Self-hosted S3-compatible object storage for service photos and master
  # avatars -- replaces external image CDNs (picsum.photos/i.pravatar.cc),
  # which are unreliable from this network (picsum geo-blocked burst
  # traffic outright during testing) and from a defense-day browser on an
  # unknown network. Bucket is named "media" specifically so the URL path
  # `/media/...` maps 1:1 onto the S3 object key -- see the gateway's
  # `location /media/` below, a plain proxy_pass with no rewrite needed.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the "media" bucket, makes it anonymously readable
  # (product photos are public by nature -- no auth needed to view a
  # catalog image) and uploads the seed image set. Re-running is safe:
  # `mc cp` just overwrites the same keys.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./frontend/public/images:/images:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/media &&
      mc anonymous set download local/media &&
      mc cp -r /images/services local/media/ &&
      mc cp -r /images/masters local/media/ &&
      mc cp -r /images/hero local/media/
      "
    restart: "no"

volumes:
  db-data:
  clickhouse-data:
  uploads:
  prometheus-data:
  grafana-data:
  minio-data:
