services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: curs3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@db:5432/curs3?sslmode=disable",
        "up",
      ]
    restart: "no"

  # One-shot: fills a fresh database with a demo tenant, staff, consumers,
  # addresses and tasks in every status (via the real domain services, so
  # passwords are hashed correctly). Safe to re-run — skips if already seeded.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/curs3?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or .env file}
      FILE_UPLOAD_DIR: /app/uploads
    # The image's ENTRYPOINT is ["./api"]; compose's `command` is appended
    # to it as arguments rather than replacing it, so this must override
    # `entrypoint` instead to actually run the seeder.
    entrypoint: ["./seed"]
    volumes:
      - uploads:/app/uploads
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/curs3?sslmode=disable
      # JWT_SECRET has no default on purpose — never commit a real secret.
      # Set it in a local .env file (see .env.example) before running.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or .env file}
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "7"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      FILE_UPLOAD_DIR: /app/uploads
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads:
